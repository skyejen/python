site_name: skyejen / python
site_url: https://skyejen.github.io/python
site_description: Python portfolio and learning by Jen - apps, projects, and the 100 Days of Python course.
site_author: skyejen

repo_name: skyejen/python
repo_url: https://github.com/skyejen/python

# Local dev server address (so all sites can run side by side)
dev_addr: 127.0.0.1:8002

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  logo: images/python-v1-1.png
  favicon: images/python-v1-1.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - sj-theme/extra.css

extra_javascript:
  - sj-theme/extra.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tilde
  # Pull the real .py / .md source files into pages (single source of truth).
  # base_path is the repo root, so pages can include e.g. day_012/is_prime.py.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: >-
  <span class="md-copyright__highlight">© 2026 Jennifer Skye</span>
  &nbsp;&middot;&nbsp; stay curious. keep building.

extra:
  generator: false

plugins:
  - search

nav:
  - Portfolio:
    - portfolio/index.md
    - Web Apps:
      - Detective Buggy: portfolio/detective-buggy.md
    - Automation:
      - Meeting Meerkat: portfolio/meeting-meerkat.md
  - Learning:
    - learning/index.md
    - 100 Days of Python:
      - Exercises and Projects:
        - learning/100-days-of-python/index.md
        - Day 2:
          - Tip Calculator: learning/100-days-of-python/day-02-tip-calculator.md
        - Day 3:
          - Introducing the Modulo: learning/100-days-of-python/day-03-introducing-the-modulo.md
          - Pizza Order Delivery: learning/100-days-of-python/day-03-pizza-order-delivery.md
          - Treasure Island: learning/100-days-of-python/day-03-treasure-island.md
        - Day 4:
          - Rock Paper Scissors: learning/100-days-of-python/day-04-rock-paper-scissors.md
        - Day 5:
          - FizzBuzz: learning/100-days-of-python/day-05-fizzbuzz.md
          - Gauss Challenge: learning/100-days-of-python/day-05-gauss-challenge.md
          - Highest Score: learning/100-days-of-python/day-05-highest-score.md
          - Password Generator: learning/100-days-of-python/day-05-password-generator.md
        - Day 11:
          - Blackjack: learning/100-days-of-python/day-11-blackjack.md
        - Day 12:
          - Is Prime: learning/100-days-of-python/day-12-is-prime.md
          - Number Guessing Game: learning/100-days-of-python/day-12-number-guessing-game.md
        - Day 14:
          - Higher Lower: learning/100-days-of-python/day-14-higher-lower-game.md
        - Day 15:
          - Coffee Machine: learning/100-days-of-python/day-15-coffee-machine.md
        - Day 16:
          - Coffee Machine (OOP): learning/100-days-of-python/day-16-coffee-machine-oop.md
      - Learning Notes:
        - learning/100-days-of-python/notes/index.md
        - Learning Notes (AI&#8209;assisted):
          - Loop Control: learning/100-days-of-python/notes/loop-control.md
          - File Naming: learning/100-days-of-python/notes/file-naming.md
          - Never Walk a List You're Changing: learning/100-days-of-python/notes/never-walk-a-list.md
          - Blackjack - What to Steal from Angela: learning/100-days-of-python/notes/blackjack-what-to-steal.md
          - Make It Work, Then Make It Nice: learning/100-days-of-python/notes/make-it-work-then-make-it-nice.md
          - Git Notes: learning/100-days-of-python/notes/git-notes.md

# Exclude the sj-theme submodule's own markdown (its README) from the built site.
# The submodule lives under docs/, but only its extra.css / extra.js are real assets.
exclude_docs: |
  sj-theme/*.md
